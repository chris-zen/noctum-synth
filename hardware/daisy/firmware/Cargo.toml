[package]
name = "noctum-micro"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["embedded-math"]
audio-profiling = ["diagnostics", "synth-core/profiling"]
diagnostics = []
embedded-math = ["synth-core/embedded-math"]
daisy-full-rate = ["synth-core/daisy-full-rate"]
oscillator-polyblep = ["synth-core/oscillator-polyblep"]
usb-audio-test-tone = []
usb-audio-raw-test = []

[dependencies]
embassy-sync.workspace = true
heapless = "0.9"
synth-core.workspace = true
wmidi.workspace = true

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
embassy-daisy.workspace = true
embassy-executor.workspace = true
embassy-futures.workspace = true
embassy-stm32.workspace = true
embassy-time.workspace = true
panic-probe.workspace = true
static_cell.workspace = true

[[bin]]
name = "noctum-micro"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "bench-dsp"
path = "src/bin/bench-dsp.rs"
required-features = ["audio-profiling"]
test = false
bench = false

[[bin]]
name = "bench-factory-presets"
path = "src/bin/bench-factory-presets.rs"
required-features = ["audio-profiling"]
test = false
bench = false
