[package]
name = "synth-core"
version = "0.1.0"
edition = "2024"
description = "Pure DSP algorithms: oscillators, filters, envelopes, LFOs — using wide for SIMD"

[features]
default = ["serde"]
serde = ["dep:serde"]
profiling = []
embedded-math = ["dep:micromath"]
daisy-full-rate = []
oscillator-polyblep = []

[dependencies]
wide = { version = "1", default-features = false }
libm = "0.2"
micromath = { version = "2.1", optional = true }
rand_core = { version = "0.10", default-features = false }
rand_pcg = { version = "0.10", default-features = false }
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1", features = ["derive"], optional = true, default-features = false }

[dev-dependencies]
rustfft = "6"
serde_json = "1"
