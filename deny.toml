[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained via egui/eframe (synth-app); no safe upgrade yet" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS via accesskit/egui stack in synth-app; pinned by eframe until upstream bumps" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml DoS via accesskit/egui stack in synth-app; pinned by eframe until upstream bumps" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
