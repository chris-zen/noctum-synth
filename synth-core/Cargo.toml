[package]
name = "synth-core"
version = "0.1.0"
edition = "2024"
description = "Pure DSP algorithms: oscillators, filters, envelopes, LFOs — using wide for SIMD"

[features]
default = ["wide-4", "filter-all", "serde"]
serde = ["dep:serde"]
profiling = []
fast-math = ["dep:micromath"]
downsampling = []
oscillator-polyblep = []
wide-8 = []
wide-4 = []
wide-1 = []

# Per-filter model features
filter-distributed-newton = []
filter-scalar-feedback = []
filter-gain-limited = []
filter-huovilainen = []
filter-cascaded-svf = []
filter-all = [
    "filter-distributed-newton",
    "filter-scalar-feedback",
    "filter-gain-limited",
    "filter-huovilainen",
    "filter-cascaded-svf",
]

[dependencies]
wide = { version = "1", default-features = false }
libm = "0.2"
micromath = { version = "2.1", optional = true }
rand_core = { version = "0.10", default-features = false }
rand_pcg = { version = "0.10", default-features = false }
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1", features = ["derive"], optional = true, default-features = false }

[dev-dependencies]
rustfft = "6"
serde_json = "1"
