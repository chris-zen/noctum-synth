[package]
name = "synth-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Host-side perf, measurement, and wavetable tooling for synth-core"

[features]
sequencer-benchmark = ["synth-core/sequencer-benchmark"]

[dependencies]
synth-core = { path = "../synth-core" }
directories = "6"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sequencer_runtime_perf"
path = "src/bin/sequencer_runtime_perf.rs"
required-features = ["sequencer-benchmark"]
