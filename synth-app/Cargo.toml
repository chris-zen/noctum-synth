[package]
name = "synth-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Standalone synth application with egui UI, MIDI input, and real-time audio"

[features]
default = ["experimental-oscillators"]
experimental-oscillators = ["synth-core/experimental-oscillators"]

[dependencies]
synth-core = { path = "../synth-core", version = "0.1.0" }

eframe = "0.34"
egui = "0.34"
midir = "0.11"
cpal = "0.18"
rtrb = "0.3"
parking_lot = "0.12"
rustfft = "6"
egui_knob = "0.3"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
wmidi = "4.0.11"
