[book]
title = "Noctum Documentation"
authors = ["Noctum contributors"]
description = "Project documentation for the noctum Rust virtual-analog synthesizer."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
