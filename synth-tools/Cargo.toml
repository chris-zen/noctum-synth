[package]
name = "synth-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Host-side perf, measurement, and wavetable tooling for synth-core"

[features]
sequencer-benchmark = ["synth-core/sequencer-benchmark"]

[dependencies]
synth-core = { path = "../synth-core", version = "0.1.0", features = ["oscillator-research"] }
directories = "6"
ndarray = { version = "0.17.2", default-features = false, features = ["std"] }
ndarray-npy = { version = "0.10.0", default-features = false, features = ["compressed_npz"] }
num-complex = "0.4.6"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "sequencer_runtime_perf"
path = "src/bin/sequencer_runtime_perf.rs"
required-features = ["sequencer-benchmark"]

[[bin]]
name = "wavetable_bank"
path = "src/bin/wavetable_bank.rs"
