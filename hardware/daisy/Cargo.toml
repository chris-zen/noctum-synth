[workspace]
members = ["embassy-daisy", "firmware"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h750ib", "time-driver-any"] }
embassy-time = "0.5.0"
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
libm = "0.2.15"
panic-probe = "1.0.0"
static_cell = "2.1.1"
stm32-fmc = "0.4.0"
wmidi = { version = "4.0.11", default-features = false }

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
# Keep support code compact within the Daisy bootloader's 480 KiB BOOT_SRAM
# execution window while allowing synth-core's real-time DSP to optimize for
# throughput below.
opt-level = "s"

[profile.release.package.synth-core]
opt-level = 3
